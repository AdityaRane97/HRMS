<div class="w-full max-w-md">
  <!-- Card -->
  <div class="bg-white rounded-lg shadow-xl p-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-primary-600 mb-2">HRMS</h1>
      <p class="text-gray-600">Human Resource Management System</p>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
      <p class="text-red-700 text-sm">{{ errorMessage }}</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Username Field -->
      <div class="mb-4">
        <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
          Username
        </label>
        <input
          type="text"
          id="username"
          formControlName="username"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-colors"
          placeholder="your.username"
          [attr.aria-invalid]="submitted && f['username'].errors ? 'true' : 'false'"
        />
        <div *ngIf="submitted && f['username'].errors" class="mt-1 text-sm text-red-600">
          <p *ngIf="f['username'].errors['required']">Username is required</p>
          <p *ngIf="f['username'].errors['minlength']">Username must be at least 3 characters</p>
        </div>
      </div>

      <!-- Password Field -->
      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
          Password
        </label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-colors"
          placeholder="Enter your password"
          [attr.aria-invalid]="submitted && f['password'].errors ? 'true' : 'false'"
        />
        <div *ngIf="submitted && f['password'].errors" class="mt-1 text-sm text-red-600">
          <p *ngIf="f['password'].errors['required']">Password is required</p>
          <p *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</p>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full py-2 px-4 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading">Signing In...</span>
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-6 text-center text-sm text-gray-600">
      <p>
        <!-- TODO: Add forgot password link -->
        <a href="#" class="text-primary-600 hover:text-primary-700 font-medium">Forgot Password?</a>
      </p>
    </div>
  </div>

  <!-- Demo Credentials (Remove in production) -->
  <div class="mt-8 text-center text-xs text-gray-400">
    <!-- TODO: Remove demo credentials before production release -->
    <p>Demo: admin / password123</p>
  </div>
</div>
