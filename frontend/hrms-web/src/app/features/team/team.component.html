<div class="p-6">
  <div *ngIf="loading" class="flex justify-center items-center h-screen">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary-600"></div>
  </div>

  <div *ngIf="error" class="bg-red-50 border border-red-200 rounded-lg p-4">
    <p class="text-red-700">{{ error }}</p>
  </div>

  <div *ngIf="!loading" class="max-w-6xl">
    <h1 class="text-3xl font-bold text-gray-900 mb-6">Team Members</h1>

    <!-- TODO: Implement team member list/table view -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let member of teamMembers" class="bg-white rounded-lg shadow p-6">
        <h3 class="text-lg font-semibold text-gray-900">{{ member.firstName }} {{ member.lastName }}</h3>
        <p class="text-sm text-gray-600">{{ member.designation }}</p>
        <p class="text-sm text-gray-500">{{ member.email }}</p>
      </div>
    </div>
  </div>
</div>
