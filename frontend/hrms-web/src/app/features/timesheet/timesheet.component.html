<div class="min-h-screen bg-gray-50 py-8 px-4 sm:px-6 lg:px-8">
  <!-- Header -->
  <div class="max-w-7xl mx-auto mb-8">
    <h1 class="text-4xl font-bold text-gray-900 mb-2">Timesheet & Attendance</h1>
    <p class="text-gray-600">Manage your time cards, attendance, and absences</p>
  </div>

  <!-- Dashboard Cards Grid -->
  <div class="max-w-7xl mx-auto">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Dashboard Card Template -->
      <div
        *ngFor="let card of dashboardCards"
        class="bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300 overflow-hidden cursor-pointer group"
        (click)="navigateTo(card.route)"
      >
        <!-- Card Header with Color Background -->
        <div
          [ngClass]="'bg-gradient-to-br ' + card.color"
          class="p-6 text-white"
        >
          <!-- Icon Container -->
          <div
            class="w-16 h-16 rounded-lg bg-white bg-opacity-20 flex items-center justify-center mb-4 group-hover:bg-opacity-30 transition-all duration-300"
          >
            <div
              class="text-white"
              [innerHTML]="getIconSvg(card.icon)"
            ></div>
          </div>

          <!-- Card Title -->
          <h2 class="text-xl font-bold mb-2">
            {{ card.title }}
          </h2>

          <!-- Card Description -->
          <p class="text-sm text-white text-opacity-90">
            {{ card.description }}
          </p>
        </div>

        <!-- Card Footer with Arrow -->
        <div
          class="px-6 py-3 bg-gray-50 flex justify-between items-center group-hover:bg-gray-100 transition-colors duration-300"
        >
          <span class="text-xs font-semibold text-gray-600 uppercase tracking-wide">
            Open
          </span>
          <svg
            class="w-5 h-5 text-gray-400 group-hover:text-gray-600 group-hover:translate-x-1 transition-all duration-300"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            />
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick Stats Section (Optional) -->
  <div class="max-w-7xl mx-auto mt-12">
    <h2 class="text-2xl font-bold text-gray-900 mb-6">Quick Overview</h2>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
      <!-- Stat Card 1 -->
      <div class="bg-white rounded-lg shadow p-6 border-l-4 border-blue-500">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-gray-600 text-sm font-medium">Hours This Week</p>
            <p class="text-3xl font-bold text-gray-900 mt-2">40.0</p>
          </div>
          <svg
            class="w-12 h-12 text-blue-100"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </div>
      </div>

      <!-- Stat Card 2 -->
      <div class="bg-white rounded-lg shadow p-6 border-l-4 border-green-500">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-gray-600 text-sm font-medium">Status</p>
            <p class="text-lg font-bold text-green-600 mt-2">In Progress</p>
            <p class="text-xs text-gray-500 mt-1">Week ending tomorrow</p>
          </div>
          <svg
            class="w-12 h-12 text-green-100"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </div>
      </div>

      <!-- Stat Card 3 -->
      <div class="bg-white rounded-lg shadow p-6 border-l-4 border-orange-500">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-gray-600 text-sm font-medium">Pending Approvals</p>
            <p class="text-3xl font-bold text-orange-600 mt-2">2</p>
            <p class="text-xs text-gray-500 mt-1">Awaiting review</p>
          </div>
          <svg
            class="w-12 h-12 text-orange-100"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </div>
      </div>

      <!-- Stat Card 4 -->
      <div class="bg-white rounded-lg shadow p-6 border-l-4 border-pink-500">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-gray-600 text-sm font-medium">Absences Approved</p>
            <p class="text-3xl font-bold text-pink-600 mt-2">3</p>
            <p class="text-xs text-gray-500 mt-1">This month</p>
          </div>
          <svg
            class="w-12 h-12 text-pink-100"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>
