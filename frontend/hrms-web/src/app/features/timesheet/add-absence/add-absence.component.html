<div class="min-h-screen bg-gray-50 py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Message Alert -->
    <div
      *ngIf="message"
      class="rounded-lg p-4 bg-green-50 border border-green-200"
    >
      <p class="text-green-700">{{ message }}</p>
    </div>

    <!-- Header -->
    <div class="bg-gradient-to-r from-gray-800 to-gray-900 text-white rounded-lg p-8 shadow-lg">
      <div class="flex items-start gap-6">
        <!-- Back Button -->
        <button
          class="p-2 hover:bg-gray-700 rounded-lg transition-colors"
          aria-label="Go back"
          (click)="goBack()"
        >
          <svg
            class="w-6 h-6"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </button>

        <!-- Avatar & Title -->
        <div>
          <div class="w-16 h-16 rounded-full bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center text-2xl font-bold text-white mb-4">
            {{ employeeInitials }}
          </div>
          <h1 class="text-3xl font-bold mb-2">Add Absence Request</h1>
          <p class="text-gray-300">{{ employeeName }}</p>
        </div>
      </div>
    </div>

    <!-- Main Form -->
    <form [formGroup]="form" class="space-y-6">
      <!-- Absence Type Card -->
      <div class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-200">
          <h2 class="text-lg font-bold text-gray-900">Absence Type</h2>
        </div>
        <div class="p-6">
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Select Type</label>
            <select
              formControlName="absenceType"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
            >
              <option *ngFor="let type of absenceTypes" [value]="type.value">
                {{ type.label }}
              </option>
            </select>
          </div>

          <!-- Balance Info -->
          <div class="bg-orange-50 border border-orange-200 rounded-lg p-4">
            <p class="text-sm text-gray-600 mb-1">Absence Type Balance</p>
            <div class="flex items-baseline gap-2">
              <span class="text-3xl font-bold text-orange-600">{{ getCurrentBalance().balance }}</span>
              <span class="text-sm text-gray-600">{{ getCurrentBalance().unit }} available</span>
            </div>
          </div>
        </div>
      </div>

      <!-- When Card -->
      <div class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-200">
          <h2 class="text-lg font-bold text-gray-900">When</h2>
        </div>
        <div class="p-6 space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Start Date</label>
              <input
                type="date"
                formControlName="startDate"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Start Time</label>
              <input
                type="time"
                formControlName="startTime"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">End Date</label>
              <input
                type="date"
                formControlName="endDate"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">End Time</label>
              <input
                type="time"
                formControlName="endTime"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
              />
            </div>
          </div>

          <!-- Duration Summary -->
          <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
            <p class="text-sm text-gray-600 mb-2">Absence Duration</p>
            <p class="text-2xl font-bold text-gray-900">{{ calculatedDuration }} days</p>
          </div>
        </div>
      </div>

      <!-- Details (Collapsible) -->
      <div class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
        <button
          type="button"
          (click)="toggleDetails()"
          class="w-full px-6 py-4 border-b border-gray-200 flex justify-between items-center hover:bg-gray-50 transition-colors"
        >
          <h2 class="text-lg font-bold text-gray-900">Details</h2>
          <svg
            class="w-5 h-5 text-gray-600 transition-transform"
            [style.transform]="showDetails ? 'rotate(180deg)' : 'rotate(0)'"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
          </svg>
        </button>
        <div *ngIf="showDetails" class="p-6 space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Reason</label>
            <input
              type="text"
              formControlName="reason"
              placeholder="e.g., Personal, Medical, Travel"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
            />
          </div>
        </div>
      </div>

      <!-- Comments and Attachments (Collapsible) -->
      <div class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
        <button
          type="button"
          (click)="toggleComments()"
          class="w-full px-6 py-4 border-b border-gray-200 flex justify-between items-center hover:bg-gray-50 transition-colors"
        >
          <h2 class="text-lg font-bold text-gray-900">Comments & Attachments</h2>
          <svg
            class="w-5 h-5 text-gray-600 transition-transform"
            [style.transform]="showComments ? 'rotate(180deg)' : 'rotate(0)'"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
          </svg>
        </button>
        <div *ngIf="showComments" class="p-6 space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Comments</label>
            <textarea
              formControlName="comments"
              rows="3"
              placeholder="Add any additional comments..."
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
            ></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Attachments</label>
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-orange-300 transition-colors">
              <svg
                class="w-12 h-12 text-gray-400 mx-auto mb-2"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
              </svg>
              <p class="text-gray-600 text-sm">Drag files here or click to select</p>
              <input
                type="file"
                formControlName="attachments"
                class="hidden"
              />
            </div>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-4 justify-end">
        <button
          type="button"
          (click)="onCancel()"
          class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-900 rounded-lg transition-colors font-medium"
        >
          Cancel
        </button>
        <button
          type="button"
          (click)="onSaveAndClose()"
          [disabled]="saving || form.invalid"
          class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg disabled:opacity-50 transition-colors font-medium"
        >
          {{ saving ? 'Saving...' : 'Save & Close' }}
        </button>
        <button
          type="button"
          (click)="onSubmit()"
          [disabled]="saving || form.invalid"
          class="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-lg disabled:opacity-50 transition-colors font-medium"
        >
          {{ saving ? 'Submitting...' : 'Submit for Approval' }}
        </button>
      </div>
    </form>
  </div>
</div>
