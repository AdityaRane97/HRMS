<div class="min-h-screen bg-gray-50 py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex items-start justify-between">
      <div>
        <button
          class="mb-4 p-2 hover:bg-gray-200 rounded-lg transition-colors inline-flex"
          aria-label="Go back"
          (click)="goBack()"
        >
          <svg
            class="w-6 h-6 text-gray-600"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <h1 class="text-4xl font-bold text-gray-900">Existing Time Cards</h1>
        <p class="text-gray-600 mt-2">View and manage your submitted time cards</p>
      </div>
    </div>

    <!-- Filters and Search -->
    <div class="bg-white rounded-lg shadow border border-gray-200 p-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Search -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Search</label>
          <input
            type="text"
            [(ngModel)]="searchTerm"
            (input)="onSearch()"
            placeholder="Search by date range..."
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- Status Filter -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
          <select
            [(ngModel)]="statusFilter"
            (change)="onStatusFilterChange()"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option>All</option>
            <option>Approved</option>
            <option>Pending</option>
            <option>Rejected</option>
            <option>Draft</option>
          </select>
        </div>

        <!-- Sort -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Sort By</label>
          <select
            [(ngModel)]="sortField"
            (change)="onSort(sortField)"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="dateRange">Date Range</option>
            <option value="totalHours">Total Hours</option>
            <option value="status">Status</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Time Cards Table -->
    <div class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="px-6 py-3 text-left">
                <button
                  (click)="onSort('dateRange')"
                  class="text-xs font-semibold text-gray-600 uppercase hover:text-gray-900 flex items-center gap-1"
                >
                  Date Range
                  <span *ngIf="sortField === 'dateRange'" class="text-blue-600">
                    {{ sortAscending ? '▲' : '▼' }}
                  </span>
                </button>
              </th>
              <th class="px-6 py-3 text-left">
                <button
                  (click)="onSort('totalHours')"
                  class="text-xs font-semibold text-gray-600 uppercase hover:text-gray-900 flex items-center gap-1"
                >
                  Hours
                  <span *ngIf="sortField === 'totalHours'" class="text-blue-600">
                    {{ sortAscending ? '▲' : '▼' }}
                  </span>
                </button>
              </th>
              <th class="px-6 py-3 text-left">
                <button
                  (click)="onSort('status')"
                  class="text-xs font-semibold text-gray-600 uppercase hover:text-gray-900 flex items-center gap-1"
                >
                  Status
                  <span *ngIf="sortField === 'status'" class="text-blue-600">
                    {{ sortAscending ? '▲' : '▼' }}
                  </span>
                </button>
              </th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Submitted Date</th>
              <th class="px-6 py-3 text-center text-xs font-semibold text-gray-600 uppercase">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let timeCard of filteredTimeCards" class="border-b border-gray-200 hover:bg-gray-50">
              <td class="px-6 py-3 text-sm text-gray-900 font-medium">{{ timeCard.dateRange }}</td>
              <td class="px-6 py-3 text-sm text-gray-900">{{ timeCard.totalHours }} hours</td>
              <td class="px-6 py-3 text-sm">
                <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold" [ngClass]="getStatusColor(timeCard.status)">
                  {{ timeCard.status }}
                </span>
              </td>
              <td class="px-6 py-3 text-sm text-gray-600">{{ formatDate(timeCard.submittedDate) }}</td>
              <td class="px-6 py-3 text-center">
                <button
                  class="px-3 py-1 text-blue-600 hover:text-blue-700 text-sm font-medium transition-colors"
                  (click)="viewTimeCard(timeCard.id)"
                >
                  View
                </button>
                <button
                  class="px-3 py-1 text-green-600 hover:text-green-700 text-sm font-medium transition-colors ml-2"
                  (click)="downloadTimeCard(timeCard.id)"
                >
                  Download
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Empty State -->
      <div *ngIf="filteredTimeCards.length === 0" class="p-8 text-center">
        <svg
          class="w-12 h-12 text-gray-400 mx-auto mb-4"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p class="text-gray-600 font-medium">No time cards found</p>
        <p class="text-gray-500 text-sm mt-1">Try adjusting your search or filters</p>
      </div>
    </div>
  </div>
</div>
