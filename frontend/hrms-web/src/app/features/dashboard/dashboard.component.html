<div class="p-6">
  <div *ngIf="loading" class="flex justify-center items-center h-screen">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary-600"></div>
  </div>

  <div *ngIf="error" class="bg-red-50 border border-red-200 rounded-lg p-4">
    <p class="text-red-700">{{ error }}</p>
  </div>

  <!-- Employee Dashboard -->
  <div *ngIf="currentUserRole === UserRole.Employee && employeeDashboard && !loading">
    <h1 class="text-3xl font-bold text-gray-900 mb-6">Employee Dashboard</h1>
    <!-- TODO: Render employee dashboard widgets -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let widget of employeeDashboard.widgets" class="bg-white rounded-lg shadow p-6">
        <h3 class="text-lg font-semibold text-gray-900">{{ widget.title }}</h3>
        <!-- TODO: Add widget-specific content based on widget.type -->
      </div>
    </div>
  </div>

  <!-- Manager Dashboard -->
  <div *ngIf="currentUserRole === UserRole.Manager && managerDashboard && !loading">
    <h1 class="text-3xl font-bold text-gray-900 mb-6">Manager Dashboard</h1>
    <!-- TODO: Render manager dashboard widgets -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let widget of managerDashboard.widgets" class="bg-white rounded-lg shadow p-6">
        <h3 class="text-lg font-semibold text-gray-900">{{ widget.title }}</h3>
        <!-- TODO: Add widget-specific content based on widget.type -->
      </div>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div *ngIf="currentUserRole === UserRole.Admin && adminDashboard && !loading">
    <h1 class="text-3xl font-bold text-gray-900 mb-6">Administrator Dashboard</h1>
    <!-- TODO: Render admin dashboard widgets -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let widget of adminDashboard.widgets" class="bg-white rounded-lg shadow p-6">
        <h3 class="text-lg font-semibold text-gray-900">{{ widget.title }}</h3>
        <!-- TODO: Add widget-specific content based on widget.type -->
      </div>
    </div>
  </div>
</div>
